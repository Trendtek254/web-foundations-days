<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notes App - Day 4</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <div class="container">
    <header class="app-header">
      <h1>Notes App</h1>
      <button id="theme-toggle" type="button" aria-label="Toggle dark mode">Toggle Dark Mode</button>
    </header>

    <main class="note-editor">
      <div class="input-group">
        <label for="note-input">Write your note:</label>
        <textarea id="note-input" placeholder="Type your note here..." rows="6"></textarea>
      </div>

      <div class="status-bar">
        <span id="char-count" class="counter">0 / 200 characters</span>
        <span id="word-count" class="counter">0 words</span>
      </div>

      <div class="action-bar">
        <button id="clear-btn" type="button">Clear</button>
      </div>
    </main>
  </div>
</body>
</html>
